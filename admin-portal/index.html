<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAGA Admin Operations Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/faga-api.js"></script>
    <script>
        async function verifyClearance() {
            if (!FagaAPI.isLoggedIn()) { window.location.href="../admin-portal/login.html"; return; }
            try {
                const user = await FagaAPI.getProfile();
                if (user.role !== 'admin') { window.location.href="./login.html"; }
            } catch { window.location.href="../admin-portal/login.html"; }
        }
        verifyClearance();
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen antialiased">
    <div class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">
        <header class="flex justify-between items-center bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
            <div>
                <h1 class="text-2xl font-black tracking-tight">FAGA Master Terminal</h1>
                <p class="text-xs text-slate-400 mt-1">Global System Onboarding Overview Parameters</p>
            </div>
            <button onclick="FagaAPI.removeToken(); window.location.href='../admin-portal/login.html';" class="px-4 py-2 text-xs font-bold text-red-400 bg-red-950/50 hover:bg-red-900/50 rounded-xl transition border border-red-900">Wipe Clearance Session</button>
        </header>

        <main class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
            <h2 class="text-xs font-black uppercase tracking-wider text-slate-400 mb-4">Pending Merchant Store Applications</h2>
            <div id="seller-table" class="space-y-3">
                Fetching unreviewed cluster nodes...
            </div>
        </main>
    </div>
    <script>
        async function fetchApplications() {
            const container = document.getElementById('seller-table');
            try {
                const list = await FagaAPI.getAdminSellers();
                if(!list || list.length === 0) {
                    container.innerHTML = `<div class="p-6 text-center text-slate-500 text-xs font-medium bg-slate-900 rounded-xl border border-slate-700 border-dashed">No open onboarding entries queued in data registers.</div>`;
                    return;
                }
                container.innerHTML = list.map(app => `
                    <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 text-xs">
                        <div>
                            <span class="text-blue-400 font-bold block uppercase tracking-wide">STORE ENTITY: ${app.storeName}</span>
                            <p class="text-slate-400 mt-0.5">📍 Hub Bounds: ${app.businessAddress} • Node User Ref: #${app.userId}</p>
                        </div>
                        <button onclick="processApproval(${app.id})" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition tracking-wide shadow-md shadow-blue-950">
                            Authorize Merchant
                        </button>
                    </div>
                `).join('');
            } catch(e) {
                container.innerText = "Error syncing framework streams.";
            }
        }

        async function processApproval(id) {
            if(confirm("Confirm security escalation query node authorization?")) {
                try {
                    await FagaAPI.approveSeller(id);
                    alert("Onboarding finalized. User profile permissions escalated successfully.");
                    fetchApplications();
                } catch(e) {
                    alert("Unable to elevate clearance token parameters.");
                }
            }
        }
        fetchApplications();
    </script>
</body>
</html>
