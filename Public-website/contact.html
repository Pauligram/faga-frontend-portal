<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact FAGA Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex min-h-screen items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl p-6 md:p-8 border border-slate-100 shadow-xl">
        <div class="mb-4">
            <a href="index.html" class="text-xs font-bold text-blue-600 hover:underline">← Return Home</a>
            <h1 class="text-2xl font-black text-slate-900 mt-2">Drop Us a Line</h1>
            <p class="text-xs text-slate-500 mt-0.5">Operational communications dispatch window.</p>
        </div>

        <form onsubmit="event.preventDefault(); alert('Message buffered safely in communication logs.'); this.reset();" class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">First Name</label>
                    <input type="text" required class="w-full text-sm border rounded-xl p-3 focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Last Name</label>
                    <input type="text" required class="w-full text-sm border rounded-xl p-3 focus:outline-none focus:border-blue-500 transition">
                </div>
            </div>
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Email Coordinates</label>
                <input type="email" required class="w-full text-sm border rounded-xl p-3 focus:outline-none focus:border-blue-500 transition" placeholder="name@domain.com">
            </div>
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Payload message</label>
                <textarea required rows="3" class="w-full text-sm border rounded-xl p-3 focus:outline-none focus:border-blue-500 transition" placeholder="Describe query parameters..."></textarea>
            </div>
            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold p-3 rounded-xl text-sm transition">
                Transmit Package Message
            </button>
        </form>
    </div>
</body>
</html>
