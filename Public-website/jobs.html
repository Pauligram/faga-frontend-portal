<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAGA Open Career Boards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/faga-api.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8">
    <div class="max-w-3xl mx-auto space-y-6">
        <header>
            <a href="index.html" class="text-sm font-bold text-blue-600 hover:underline">← Home</a>
            <h1 class="text-3xl font-black text-slate-900 mt-2">Open Job Boards</h1>
        </header>
        <div id="jobs-container" class="space-y-3 text-sm text-slate-500">
            Syncing available positions from operational cluster databases...
        </div>
    </div>
    <script>
        async function fetchJobs() {
            try {
                const jobs = await FagaAPI.getJobs();
                const container = document.getElementById('jobs-container');
                if(!jobs || jobs.length === 0) {
                    container.innerHTML = `<div class="bg-white p-6 rounded-2xl border border-slate-100 text-center text-slate-400">No active career paths open today. Check back later!</div>`;
                    return;
                }
                container.innerHTML = jobs.map(job => `
                    <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h3 class="font-bold text-slate-900 text-base">${job.title}</h3>
                            <p class="text-xs text-slate-500 mt-1">${job.description}</p>
                        </div>
                        <span class="bg-blue-50 text-blue-600 text-xs font-black uppercase tracking-wider px-3 py-1 rounded-lg self-start md:self-auto">${job.status}</span>
                    </div>
                `).join('');
            } catch(e) {
                document.getElementById('jobs-container').innerText = "Unable to process career listings.";
            }
        }
        fetchJobs();
    </script>
</body>
</html>
