<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAGA Operations Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/faga-api.js"></script>
    <script>
        if (!FagaAPI.isLoggedIn()) { window.location.href = "login.html"; }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
    <div class="max-w-6xl mx-auto p-4 md:p-6">
        <header class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between bg-white rounded-2xl p-6 shadow-sm gap-4 border border-slate-100">
            <div>
                <h1 class="text-xl md:text-2xl font-black text-slate-900">FAGA Production Terminal</h1>
                <p id="user-email" class="text-xs md:text-sm text-slate-500 mt-0.5">Fetching encrypted credentials...</p>
            </div>
            <button onclick="FagaAPI.removeToken(); window.location.href='login.html';" class="px-4 py-2 text-xs font-bold text-red-600 bg-red-50 hover:bg-red-100 rounded-xl transition self-start md:self-auto">
                Logout Session
            </button>
        </header>

        <div class="grid gap-6 md:grid-cols-3">
            <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 md:col-span-1 h-fit">
                <h2 class="text-xs font-black uppercase tracking-wider text-slate-400 mb-4">Route New Consignment</h2>
                <div id="booking-msg" class="hidden mb-3 p-3 rounded-xl text-xs font-semibold"></div>
                <form id="booking-form" class="space-y-3">
                    <input type="text" id="pickup" required placeholder="Pickup Street Coordinates" class="w-full rounded-xl border border-slate-200 p-3 text-sm focus:outline-none focus:border-blue-500 transition">
                    <input type="text" id="dropoff" required placeholder="Destination Delivery Target" class="w-full rounded-xl border border-slate-200 p-3 text-sm focus:outline-none focus:border-blue-500 transition">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-xl text-sm transition shadow-md shadow-blue-50">
                        Dispatch Courier Route
                    </button>
                </form>
            </section>

            <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 md:col-span-2">
                <h2 class="text-xs font-black uppercase tracking-wider text-slate-400 mb-4">Active Core Manifest Streams</h2>
                <div id="manifest-stream" class="space-y-3 text-sm text-slate-500">
                    Synchronizing transaction logs with cluster...
                </div>
            </section>
        </div>
    </div>
    <script>
        async function syncWorkspaceMetrics() {
            try {
                const user = await FagaAPI.getProfile();
                document.getElementById('user-email').innerText = `${user.email} • Level Privileges: ${user.role}`;

                const orders = await FagaAPI.getDeliveries();
                const container = document.getElementById('manifest-stream');
                
                if(!orders || orders.length === 0) {
                    container.innerHTML = `<div class="p-8 text-center text-slate-400 border border-dashed rounded-xl">No transaction arrays linked to this identity credential block.</div>`;
                    return;
                }

                container.innerHTML = orders.map(order => `
                    <div class="flex items-center justify-between p-4 rounded-xl border border-slate-100 bg-slate-50/50 hover:bg-slate-50 transition gap-4">
                        <div class="truncate">
                            <span class="text-[10px] font-black text-slate-400 block uppercase tracking-wider">MANIFEST LOG REF: #00${order.id}</span>
                            <p class="font-medium text-slate-700 truncate mt-0.5">📍 ${order.pickupAddress} ➡️ ${order.dropoffAddress}</p>
                        </div>
                        <span class="px-2.5 py-1 rounded-md text-[10px] font-black uppercase tracking-wider ${order.status === 'PENDING' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-green-700'}">${order.status}</span>
                    </div>
                `).join('');
            } catch(e) {
                console.error(e);
            }
        }

        document.getElementById('booking-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('booking-msg');
            try {
                await FagaAPI.createDelivery(document.getElementById('pickup').value, document.getElementById('dropoff').value);
                msg.className = "mb-3 p-3 rounded-xl text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-100";
                msg.innerText = "Manifest routed successfully! Syncing logs...";
                document.getElementById('booking-form').reset();
                syncWorkspaceMetrics();
            } catch (err) {
                msg.className = "mb-3 p-3 rounded-xl text-xs font-semibold bg-red-50 text-red-700 border border-red-100";
                msg.innerText = "Failed to log dispatch order constraints.";
            }
            msg.classList.remove('hidden');
        });
        syncWorkspaceMetrics();
    </script>
</body>
</html>
