<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover FAGA Account Key</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex min-h-screen items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white rounded-2xl p-6 md:p-8 shadow-xl border border-slate-100">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-slate-900">Reset Credentials</h1>
            <p class="text-xs text-slate-500 mt-1">Input account coordinates to receive verification arrays.</p>
        </div>
        <form onsubmit="event.preventDefault(); alert('Verification sequence channeled to network address.'); window.location.href='./login.html';" class="space-y-3">
            <input type="email" required placeholder="Registered Email Address" class="w-full rounded-xl border p-3 text-sm focus:outline-none focus:border-blue-500 transition">
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-xl text-sm transition shadow-lg shadow-blue-100">
                Issue Recovery Instructions
            </button>
        </form>
    </div>
</body>
</html>
