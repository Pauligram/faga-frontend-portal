<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAGA Authentication Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/faga-api.js"></script>
</head>
<body class="bg-slate-50 flex min-h-screen items-center justify-center p-4">
    <div class="w-full max-w-md rounded-2xl bg-white p-6 md:p-8 shadow-xl border border-slate-100">
        <div class="mb-6 text-center">
            <h1 class="text-3xl font-black tracking-tight text-blue-600">FA GA Hub</h1>
            <p class="mt-1 text-sm text-slate-500">Sign in to manage logistics configurations</p>
        </div>
        <div id="error-box" class="hidden mb-4 rounded-xl bg-red-50 p-4 text-xs font-semibold text-red-600 border border-red-100"></div>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full rounded-xl border border-slate-200 p-3 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition" placeholder="driver@faga.com">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Password</label>
                <input type="password" id="password" required class="w-full rounded-xl border border-slate-200 p-3 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition" placeholder="••••••••">
            </div>
            <button type="submit" id="submit-btn" class="w-full rounded-xl bg-blue-600 p-3 text-sm font-bold text-white shadow-lg shadow-blue-100 hover:bg-blue-700 transition">
                Authenticate Session
            </button>
        </form>
        <p class="mt-4 text-center text-xs text-slate-400">New around here? <a href="register.html" class="font-bold text-blue-500 hover:underline">Create an Account</a></p>
    </div>
    <script>
        if (FagaAPI.isLoggedIn()) { window.location.href = "dashboard.html"; }
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('error-box');
            const submitBtn = document.getElementById('submit-btn');
            errorBox.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerText = "Verifying Token Map...";
            try {
                await FagaAPI.login(document.getElementById('email').value, document.getElementById('password').value);
                window.location.href = "dashboard.html";
            } catch (err) {
                errorBox.classList.remove('hidden');
                errorBox.innerText = err.data?.message || "Invalid email parameter or password string.";
                submitBtn.disabled = false;
                submitBtn.innerText = "Authenticate Session";
            }
        });
    </script>
</body>
</html>
