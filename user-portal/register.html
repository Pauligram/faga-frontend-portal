<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create FAGA Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/faga-api.js"></script>
</head>
<body class="bg-slate-50 flex min-h-screen items-center justify-center p-4">
    <div class="w-full max-w-md rounded-2xl bg-white p-6 md:p-8 shadow-xl border border-slate-100">
        <div class="mb-6 text-center">
            <h1 class="text-3xl font-black tracking-tight text-blue-600">Register</h1>
            <p class="mt-1 text-sm text-slate-500">Join the distributed network layer</p>
        </div>
        <div id="error-box" class="hidden mb-4 rounded-xl bg-red-50 p-4 text-xs font-semibold text-red-600 border border-red-100"></div>
        <form id="reg-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Full Name</label>
                <input type="text" id="name" required class="w-full rounded-xl border border-slate-200 p-3 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition" placeholder="John Doe">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full rounded-xl border border-slate-200 p-3 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition" placeholder="john@faga.com">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Password</label>
                <input type="password" id="password" required class="w-full rounded-xl border border-slate-200 p-3 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition" placeholder="••••••••">
            </div>
            <button type="submit" id="submit-btn" class="w-full rounded-xl bg-blue-600 p-3 text-sm font-bold text-white shadow-lg shadow-blue-100 hover:bg-blue-700 transition">
                Create Account Profile
            </button>
        </form>
    </div>
    <script>
        document.getElementById('reg-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('error-box');
            errorBox.classList.add('hidden');
            try {
                await FagaAPI.register(document.getElementById('name').value, document.getElementById('email').value, document.getElementById('password').value);
                alert('Profile constructed. Kindly log in to activate session parameters.');
                window.location.href = "login.html";
            } catch (err) {
                errorBox.classList.remove('hidden');
                errorBox.innerText = err.data?.error || "Registration validation conflict.";
            }
        });
    </script>
</body>
</html>
